# Keeps the GitHub Actions in the workflows and the npm dependencies
# current. Minor and patch npm updates arrive as one grouped pull
# request a week; majors come one by one so each can be reviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # These majors fail the checks today. Drop an entry once the code
      # has been moved to the new major by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: vite-plugin-pwa
        update-types: ['version-update:semver-major']
      # Permanent: the Node types follow the Node version pinned in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
