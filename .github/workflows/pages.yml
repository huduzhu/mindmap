name: Pages

# Publishes the app to GitHub Pages at https://huduzhu.github.io/mindmap/.
# It runs when a release is published, building that release's tag, so the hosted
# app always matches the latest release; Actions -> Pages -> Run workflow deploys
# by hand. Pushes to main never deploy. Needs Settings -> Pages -> Source set to
# "GitHub Actions". The build uses BASE_PATH so every URL, the manifest and the
# service worker stay inside /mindmap/.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits rather than cancelling a
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same gates as CI, so "Run workflow" on a failing commit deploys
      # nothing. Any failure stops the run before the upload.
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Schema fixtures, goldens, presets and examples
        run: npm run validate:fixtures
      - name: Tests
        run: npm test
      - name: Build (tsc -b + viewer + app)
        run: npm run build
        env:
          BASE_PATH: /mindmap/
      - name: Bundle budget
        run: npm run size
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
