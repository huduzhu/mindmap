name: CI

# Pushes to main and version tags, and every pull request. Other branches are
# checked through their pull request, so a Dependabot PR no longer runs twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The job only reads the repo; don't hand it a write-all token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fast gates first, and every gate runs even if an earlier one failed, so a
      # type error in `build` no longer hides the test/lint/fixture results.
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Schema fixtures, goldens, presets and examples
        if: ${{ !cancelled() }}
        run: npm run validate:fixtures
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build (tsc -b + viewer + app)
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Bundle budget
        if: ${{ !cancelled() }}
        run: npm run size
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  # Browser E2E: Playwright against `vite preview` of a fresh build, plus
  # the dev-server-only checks in e2e/dev.spec.ts.
  e2e:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npm run e2e:install
      - name: E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
