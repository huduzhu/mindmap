name: CI

on:
  push:
  pull_request:

# The job only reads the repo; don't hand it a write-all token (#59).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No job pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fast gates first, and every gate runs even if an earlier one failed, so a
      # type error in `build` no longer hides the test/lint/fixture results.
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Schema fixtures, goldens, presets and examples
        if: ${{ !cancelled() }}
        run: npm run validate:fixtures
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build (tsc -b + viewer + app)
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Bundle budget (#88)
        if: ${{ !cancelled() }}
        run: npm run size
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  # Browser E2E (#63): Playwright against `vite preview` of a fresh build, plus
  # the dev-server-only checks in e2e/dev.spec.ts.
  e2e:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # No job pushes, so the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npm run e2e:install
      - name: E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
